name: Verify Human Identity

on:
  workflow_dispatch:
    inputs:
      agent_name:
        description: 'Agent Name'
        required: true
        default: 'yeahgyrist'
      agent_description:
        description: 'Agent Description'
        required: true
        default: 'yeahgyrist AI Agent'

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # Hilangkan warning Node.js selamanya

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cleanup folder lama
        run: rm -rf scripts skills verified-agent-identity

      - name: Install ClawHub skill (pakai --force)
        run: npx clawhub@latest install verified-agent-identity --force

      - name: Debug - Cek folder (penting!)
        run: |
          echo "=== Isi root folder ==="
          ls -la
          echo "=== Folder scripts ==="
          ls -la scripts/ || echo "scripts/ TIDAK ADA!"

      - name: Install dependencies
        run: |
          cd scripts
          npm install

      - name: Step 2 - Create new Ethereum Identity
        run: node scripts/createNewEthereumIdentity.js

      - name: Step 3 - Link Human to Agent
        run: |
          node scripts/manualLinkHumanToAgent.js \
            --challenge '{"name": "${{ inputs.agent_name }}", "description": "${{ inputs.agent_description }}"}'
