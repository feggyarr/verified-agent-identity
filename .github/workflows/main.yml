name: Verify Human Identity

on:
  workflow_dispatch:
    inputs:
      agent_name:
        description: 'Agent Name'
        required: true
        default: 'yeahgyrist'
      agent_description:
        description: 'Agent Description'
        required: true
        default: 'yeahgyrist AI Agent'

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # Hilangkan warning Node.js selamanya

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cleanup folder lama (penting!)
        run: rm -rf skills/verified-agent-identity

      - name: Install ClawHub skill (non-interactive)
        run: npx clawhub@latest install verified-agent-identity --yes --no-input

      # === DEBUG SUPER LENGKAP ===
      - name: DEBUG - Cek struktur folder
        run: |
          echo "=== Isi root ==="
          ls -la
          echo "=== Folder skills ==="
          ls -la skills/ || echo "skills/ TIDAK ADA"
          echo "=== Folder skill ==="
          ls -la skills/verified-agent-identity/ || echo "verified-agent-identity TIDAK ADA"
          echo "=== Folder scripts ==="
          ls -la skills/verified-agent-identity/scripts/ || echo "scripts/ TIDAK ADA"
          echo "=== Semua scripts di repo ==="
          find . -name "*.js" | head -10

      - name: Install script dependencies
        run: |
          cd skills/verified-agent-identity/scripts
          npm install
          npm install ethers @0xpolygonid/js-sdk @iden3/js-iden3-auth uuid cross-fetch shell-quote --save

      - name: Create new Ethereum Identity
        run: node skills/verified-agent-identity/scripts/createNewEthereumIdentity.js

      - name: Link Human to Agent
        run: |
          node skills/verified-agent-identity/scripts/manualLinkHumanToAgent.js \
            --challenge '{"name": "${{ inputs.agent_name }}", "description": "${{ inputs.agent_description }}"}'
